name: run-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Composer works on a copy, so the published composer.json stays intact
  # (see .github/scripts/use-spid-laravel-fork.sh).
  COMPOSER: composer.ci.json

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # PHP 8.2 leaves security support on 2026-12-31 and is not supported.
        php: [8.5, 8.4, 8.3]
        # Laravel 11 is not tested: it is end of life and every 11.x release
        # carries unpatched advisories, so Composer refuses to install it.
        laravel: [13.*, 12.*]
        # Filament 3 and 4 run on Livewire 3, Filament 5 on Livewire 4.
        filament: [5.*, 4.*, 3.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: ^3.0
          - laravel: 12.*
            testbench: 10.*
            carbon: ^3.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Use the patched italia/spid-laravel
        run: bash .github/scripts/use-spid-laravel-fork.sh

      - name: Install dependencies
        env:
          COMPOSER_EXIT_ON_PATCH_FAILURE: 1
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Check the SPID patch reached php-saml
        run: test -f vendor/onelogin/php-saml/PATCHES.txt

      - name: Audit dependencies
        run: composer audit

      - name: Execute tests
        run: vendor/bin/pest

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: xdebug
          tools: composer:v2

      - name: Use the patched italia/spid-laravel
        run: bash .github/scripts/use-spid-laravel-fork.sh

      - name: Install dependencies
        env:
          COMPOSER_EXIT_ON_PATCH_FAILURE: 1
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests with coverage
        run: |
          mkdir -p build/logs
          vendor/bin/pest --coverage --min=100 --coverage-clover=build/logs/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/logs/coverage.xml
          fail_ci_if_error: false

  # The distributable archive (composer archive: .gitattributes applies)
  # installed into a fresh Laravel app by the published quickstart. One leg per
  # integration path: Livewire 3 on Filament 3 and 4, Livewire 4 on Filament 5,
  # Laravel 12 and 13. The 18-leg matrix above covers the rest.
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: 8.3, laravel: 12, filament: 3 }
          - { php: 8.4, laravel: 13, filament: 4 }
          - { php: 8.5, laravel: 13, filament: 5 }
    name: Install P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }}
    env:
      # The archive and the fresh app use their own composer.json.
      COMPOSER: composer.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, fileinfo, openssl
          coverage: none
          tools: composer:v2

      - name: Install the archive by the quickstart
        env:
          LARAVEL: ${{ matrix.laravel }}
          FILAMENT: ${{ matrix.filament }}
          COMPOSER_EXIT_ON_PATCH_FAILURE: 1
        run: bash .github/scripts/install-check.sh "$RUNNER_TEMP/install"

  # The SPID button script: dependency-free, tested with Node's own runner.
  button-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Button script

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Execute tests
        run: node --test 'tests/js/*.test.mjs'

  # One check for branch protection to require instead of every matrix leg.
  tests-passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: tests-passed
    needs: [test, coverage, button-script, install]
    if: always()

    steps:
      - name: Require every test leg and the coverage job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUTTON_RESULT: ${{ needs.button-script.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          echo "test: $TEST_RESULT, coverage: $COVERAGE_RESULT, button script: $BUTTON_RESULT, install: $INSTALL_RESULT"
          [ "$TEST_RESULT" = success ] && [ "$COVERAGE_RESULT" = success ] && [ "$BUTTON_RESULT" = success ] && [ "$INSTALL_RESULT" = success ]
