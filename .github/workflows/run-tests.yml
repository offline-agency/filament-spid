name: run-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4, 8.3, 8.2]
        laravel: [13.*, 12.*, 11.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: ^3.0
          - laravel: 12.*
            testbench: 10.*
            carbon: ^3.0
          - laravel: 11.*
            testbench: 9.*
            carbon: ^2.63|^3.0
        exclude:
          # Laravel 13 requires PHP 8.3
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Use the patched italia/spid-laravel
        run: bash .github/scripts/use-spid-laravel-fork.sh

      - name: Install dependencies
        env:
          COMPOSER_EXIT_ON_PATCH_FAILURE: 1
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Check the SPID patch reached php-saml
        run: test -f vendor/onelogin/php-saml/PATCHES.txt

      - name: Audit dependencies
        run: composer audit

      - name: Execute tests
        run: vendor/bin/pest

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: xdebug
          tools: composer:v2

      - name: Use the patched italia/spid-laravel
        run: bash .github/scripts/use-spid-laravel-fork.sh

      - name: Install dependencies
        env:
          COMPOSER_EXIT_ON_PATCH_FAILURE: 1
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests with coverage
        run: |
          mkdir -p build/logs
          vendor/bin/pest --coverage --coverage-clover=build/logs/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/logs/coverage.xml
          fail_ci_if_error: false
