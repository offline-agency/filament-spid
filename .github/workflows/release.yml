name: release

# Tags and releases a merged pull request into main.
#
# The bump comes from the PR labels release:major / release:minor /
# release:patch (patch when none is set); skip-release and Dependabot PRs
# produce no release. release-check.yml makes sure every PR carries one of
# those labels. workflow_dispatch releases main by hand.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-release'))

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Determine the bump
        id: bump
        env:
          DISPATCH_BUMP: ${{ inputs.bump }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if [ -n "$DISPATCH_BUMP" ]; then
            bump="$DISPATCH_BUMP"
          elif jq -e 'index("release:major")' <<<"$LABELS" >/dev/null; then
            bump="major"
          elif jq -e 'index("release:minor")' <<<"$LABELS" >/dev/null; then
            bump="minor"
          else
            bump="patch"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump: $bump"

      - name: Compute the version
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          # Tags carry no v prefix (0.1.8).
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          next=$(bash .github/scripts/next-version.sh "$latest" "$BUMP")
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Tag $next already exists"
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Latest: ${latest:-none}, next: $next"

      - name: Create the tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "refs/tags/$NEXT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          bash .github/scripts/release-notes.sh CHANGELOG.md "$NEXT" > notes.md
          args=(--title "$NEXT" --generate-notes --notes-file notes.md --verify-tag)
          if [ -n "$LATEST" ]; then
            args+=(--notes-start-tag "$LATEST")
          fi
          gh release create "$NEXT" "${args[@]}"
